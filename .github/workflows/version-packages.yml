name: Prepare package versions

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: version-packages-main
  cancel-in-progress: true

jobs:
  version:
    if: github.repository == 'tootiapps/streamshare'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 11.9.0
          runtime: node@22
          cache: true
          install: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Select the Changesets mode
        id: changesets
        uses: changesets/action/select-mode@v2

      - name: Create or update the version pull request
        if: steps.changesets.outputs.mode == 'version'
        uses: changesets/action/version@v2
        with:
          script: pnpm version-packages
          commit-message: 'release: version packages'
          pr-title: 'release: version packages'
          pr-draft: create
          pr-base-branch: main
