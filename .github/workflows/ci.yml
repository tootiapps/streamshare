name: Public validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare the Changesets base branch
        if: github.event_name == 'pull_request'
        run: git branch main origin/main

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 11.9.0
          runtime: node@22
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate the public workspace
        run: pnpm run ci
